# Builds, signs and packages DailyBee for a tag such as v0.2.0 and attaches the installers plus the
# electron-updater feed files (latest.yml, latest-mac.yml, latest-linux.yml) to a GitHub release.
# Copy those files to the update feed (DAILYBEE_UPDATE_URL) and every installed app updates itself.
#
# Repository settings this reads (all optional; without them the build is unsigned and has no feed):
#   Variables:  DAILYBEE_UPDATE_URL, DAILYBEE_PUBLISHER, AZURE_SIGN_ENDPOINT, AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE
#   Secrets:    CSC_LINK, CSC_KEY_PASSWORD (a .pfx as base64 + its password), or
#               AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (Azure Trusted Signing),
#               APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (macOS notarization)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm (the version pinned in package.json)
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test
      - name: Build and package
        env:
          DAILYBEE_UPDATE_URL: ${{ vars.DAILYBEE_UPDATE_URL }}
          DAILYBEE_PUBLISHER: ${{ vars.DAILYBEE_PUBLISHER }}
          VITE_DAILYBEE_CLOUD_URL: ${{ vars.VITE_DAILYBEE_CLOUD_URL }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm --filter @dailybee/desktop build
          pnpm --filter @dailybee/desktop exec electron-builder ${{ matrix.args }} --config electron-builder.config.cjs --publish never
      - name: Keep the installers and the feed files
        uses: actions/upload-artifact@v4
        with:
          name: dailybee-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach everything to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
